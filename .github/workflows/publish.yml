name: Publish

on:
  push:
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version to publish from release/<tag>, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.metadata.outputs.sha }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('release/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME#release/}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release branches must be named release/vX.Y.Z (optional prerelease/build suffixes are supported)"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            CURRENT_SHA=$(git rev-parse HEAD)
            if [ "$TAG_SHA" != "$CURRENT_SHA" ]; then
              echo "::error::$TAG already points to $TAG_SHA; refusing to publish $CURRENT_SHA"
              exit 1
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=release/$TAG" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Synchronize version metadata
        run: bun .github/scripts/set-release-version.mjs "${{ steps.release.outputs.tag }}"

      - name: Commit version metadata
        id: metadata
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git diff --quiet -- package.json server.json src/cli.ts; then
            echo "Version metadata already matches $RELEASE_TAG"
          else
            if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "::error::$RELEASE_TAG already exists; refusing to change its release metadata"
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json server.json src/cli.ts
            git commit -m "chore(release): set version to ${RELEASE_TAG#v}"
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          fi

          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing $RELEASE_TAG from ${SHA:0:7}"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      # OIDC, used twice: npm trusted publishing and the MCP registry login.
      # Between them the release needs no stored credential at all.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # setup-node ships whatever npm was bundled with that Node release, which
      # is routinely older than 11.5.1 — the first version that can exchange the
      # OIDC token for a publish. Without this the job fails with a misleading
      # ENEEDAUTH or E404, so the version is asserted rather than assumed.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          VERSION=$(npm --version)
          echo "npm $VERSION"
          MIN=11.5.1
          if [ "$(printf '%s\n%s\n' "$MIN" "$VERSION" | sort -V | head -1)" != "$MIN" ]; then
            echo "::error::npm $VERSION is older than $MIN; trusted publishing will fail with a misleading ENEEDAUTH/E404"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # A tag is immutable and npm versions cannot be reused, so everything that
      # can fail is made to fail before anything is published.
      - name: Check release metadata
        run: node .github/scripts/check-release-metadata.mjs "${{ needs.prepare.outputs.tag }}"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Smoke-test the Node build
        run: node dist/cli.js --version

      ### npm

      # No NODE_AUTH_TOKEN: the OIDC token from `id-token: write` is the
      # credential. Provenance is generated automatically on a trusted publish,
      # so `--provenance` is not passed either.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          EXPECTED_MCP_NAME=$(node -p "require('./package.json').mcpName")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            PUBLISHED_MCP_NAME=$(npm view "$NAME@$VERSION" mcpName 2>/dev/null || true)
            if [ "$PUBLISHED_MCP_NAME" != "$EXPECTED_MCP_NAME" ]; then
              echo "::error::$NAME@$VERSION is already published with mcpName '$PUBLISHED_MCP_NAME', expected '$EXPECTED_MCP_NAME'. npm versions are immutable; create a new release version."
              exit 1
            fi
            echo "$NAME@$VERSION is already live on npm; skipping publish"
          else
            npm publish
          fi

      # The registry verifies the npm package exists and carries a matching
      # `mcpName` before it will accept server.json. npm's read path is
      # eventually consistent, so give it a moment rather than racing it.
      - name: Wait for npm to serve the new version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          for i in $(seq 1 30); do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is live on npm"
              exit 0
            fi
            echo "attempt $i: not visible yet, waiting…"
            sleep 10
          done
          echo "::error::$NAME@$VERSION never became visible on npm"
          exit 1

      ### MCP registry

      - name: Install mcp-publisher
        run: |
          curl -fL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP registry
        run: ./mcp-publisher publish

  tag:
    name: Git tag
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Create the release tag
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --force --tags origin

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
              echo "::error::$RELEASE_TAG already points to $TAG_SHA, not $RELEASE_SHA"
              exit 1
            fi
            echo "$RELEASE_TAG already points to the published commit"
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  release:
    name: GitHub release
    needs: [prepare, publish, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --generate-notes \
              --verify-tag
          fi
